services:
  redis:
    image: redis:7-alpine
    container_name: cep-api-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "4000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # --- Configuração de Email (SMTP) ---
      # Descomente e preencha as variáveis abaixo se for utilizar alertas por Email
      # - GF_SMTP_ENABLED=${GRAFANA_SMTP_ENABLED:-true}
      # - GF_SMTP_HOST=${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      # - GF_SMTP_USER=${GRAFANA_SMTP_USER}
      # - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      # - GF_SMTP_SKIP_VERIFY=true
      # - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM}
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  grafana_data:
